[package]
name = "whisp-win"
version = "0.1.0"
edition = "2024"
description = "A native Windows scratchpad based on Whisp"
publish = false

[[bin]]
name = "whisp"
path = "src/main.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
